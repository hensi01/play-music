# GoReleaser config
project_name: play-music
version: 2

builds:
  - id: play-music
    # Instead of compiling the binary with goreleaser, we just copy it from `binaries` folder
    # This is because we need to compile the binaries with our Dockerfile, and to avoid having to
    # compile it twice, we just copy the docker build output. The xxgo script handles this for us
    tool: "./release/xxgo"

    # All available targets compiled by the Dockerfile
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_386
      - linux_amd64
      - linux_arm_v5
      - linux_arm_v6
      - linux_arm_v7
      - linux_arm64
      - linux_riscv64
      - windows_386
      - windows_amd64

archives:
  - format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

snapshot:
  version_template: "{{ .Version }}-SNAPSHOT"

release:
  draft: true
  mode: append
  footer: |
    **Full Changelog**: https://github.com/hensi01/play-music/compare/{{ .PreviousTag }}...{{ .Tag }}

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^test:"
      - "^refactor:"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
  groups:
    - title: "New Features"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 100
    - title: "Security updates"
      regexp: '^.*?sec(\(.+\))??!?:.+$'
      order: 150
    - title: "Bug fixes"
      regexp: '^.*?(fix|refactor)(\(.+\))??!?:.+$'
      order: 200
    - title: "Documentation updates"
      regexp: ^.*?docs?(\(.+\))??!?:.+$
      order: 400
    - title: "Build process updates"
      regexp: ^.*?(build|ci)(\(.+\))??!?:.+$
      order: 400
    - title: Other work
      order: 9999
