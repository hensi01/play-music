[package]
name = "play-music-rust"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
axum = "0.7"
mime_guess = "2"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bcrypt = "0.16"
jsonwebtoken = "9"
rand = "0.8"
hex = "0.4"

url = "2"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
percent-encoding = "2"
humantime = "2"
