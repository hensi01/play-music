<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0B0F" />
    <meta name="description" content="Play Music - player web de musica" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Play Music" />
    <title>Play Music</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./style.css?v=__ASSET_VERSION__" />
    <script>
      window.__APP_CONFIG__ = {
        version: '__ASSET_VERSION__',
        firstTime: false,
        // URL base da API do backend (Play Music), injetada do ambiente
        // (ND_FRONTEND_BASEURL no .env) pelo backend em tempo de boot.
        // Vazio = mesmo domínio do front end. Ex.: 'https://music.centralcursoss.com.br'
        baseURL: __FRONTEND_BASEURL__
      }
    </script>
  </head>
  <body>
    <noscript>Você precisa habilitar o JavaScript para usar o Play Music.</noscript>
    <div id="app"></div>
    <script type="module" src="./app.js?v=__ASSET_VERSION__"></script>
    <script src="./pwa.js?v=__ASSET_VERSION__"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js?v=__ASSET_VERSION__').catch(function () {})
        })
      }
    </script>
  </body>
</html>
