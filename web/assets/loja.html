<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0B0F" />
    <title>Loja — Play Music</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./i18n.js"></script>
  </head>
  <body class="loja">
    <header class="topbar">
      <span class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        Play Music — Loja
      </span>
      <div class="login-box" id="loginBox">
        <span class="msg" id="loginMsg"></span>
        <input id="phoneInput" type="tel" inputmode="numeric" placeholder="(99) 99999-9999" />
        <button id="loginBtn">Entrar</button>
      </div>
    </header>

    <main>
      <h1 id="storeH1">Escolha suas categorias</h1>
      <p class="subtitle" id="storeSubtitle">Compre a categoria e ouça todas as músicas dela no Play Music.</p>

      <section>
        <h2 id="storeCatsTitle">Categorias</h2>
        <div class="grid" id="catGrid"></div>
      </section>

      <section id="packsSection">
        <h2 id="storePacksTitle">Packs</h2>
        <div class="grid" id="packsGrid"></div>
      </section>

      <a class="back-btn" href="/" id="storeBack">← Voltar para o Play Music</a>
    </main>

    <footer id="storeFooter">Play Music &middot; Loja de categorias</footer>

    <script>
      // =====================================================================
      // ===================== CONFIGURAÇÃO DA LOJA =========================
      // Edite aqui os preços e os links de checkout (externos).
      // A chave é o NOME da categoria (como aparece no app). Preços e links
      // só aparecem NESTA página.
      // =====================================================================
      const STORE_CONFIG = {
        // preço/link por categoria: { 'Nome da Categoria': { price: 'R$ 9,90', url: 'https://...' } }
        categories: {
          'Cristão': { price: 'R$ 9,90', url: 'https://checkout.exemplo.com/cristao' },
        },
        // packs: { name, price, url, categories: ['Nome1', 'Nome2'], desc }
        packs: [
          {
            name: 'Pacote Completo',
            price: 'R$ 19,90',
            url: 'https://checkout.exemplo.com/pacote-completo',
            categories: ['Cristão'],
            desc: 'Todas as categorias por um preço especial.',
          },
        ],
      }
      // =====================================================================

      const TOKEN_KEY = 'pm_token'
      const $ = (sel) => document.querySelector(sel)

      // Tradução via window.__i18n (módulo ES carregado no <head>; a UI é
      // montada no evento load, quando o i18n já está disponível).
      const tt = (key, vars) => (window.__i18n ? window.__i18n.t(key, vars) : key)
      const tplural = (key, n) => (window.__i18n ? window.__i18n.plural(key, n) : String(n))

      function getToken() { return localStorage.getItem(TOKEN_KEY) }

      async function api(path, opts = {}) {
        const headers = new Headers(opts.headers || {})
        const token = getToken()
        if (token) headers.set('X-ND-Authorization', 'Bearer ' + token)
        const res = await fetch(path, { ...opts, headers })
        if (res.status === 401) { localStorage.removeItem(TOKEN_KEY); renderUser() }
        if (!res.ok) {
          let msg = 'HTTP ' + res.status
          try { const b = await res.json(); if (b.error) msg = b.error } catch {}
          throw new Error(window.__i18n ? window.__i18n.translateBackendError(msg, res.status) : msg)
        }
        if (res.status === 204) return undefined
        return res.json()
      }

      const fmt = (n) => tplural('count.songs', n)

      function esc(s) {
        return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
      }

      function renderUser() {
        const box = $('#loginBox')
        const token = getToken()
        if (!token) { box.innerHTML = '<span class="msg" id="loginMsg"></span><input id="phoneInput" type="tel" inputmode="numeric" placeholder="(99) 99999-9999" /><button id="loginBtn">' + tt('store.enter') + '</button>'; bindLogin(); return }
        api('/api/me').then((u) => {
          box.innerHTML = '<span class="user-chip">' + tt('store.connected') + ' <strong>' + esc(u.name || u.phone || '') + '</strong></span>'
        }).catch(() => {
          localStorage.removeItem(TOKEN_KEY)
          renderUser()
        })
      }

      function bindLogin() {
        const btn = $('#loginBtn')
        const input = $('#phoneInput')
        const msg = $('#loginMsg')
        input.addEventListener('input', () => {
          let d = input.value.replace(/\D/g, '').slice(0, 11)
          let out = ''
          for (let i = 0; i < d.length; i++) {
            if (i === 0) out += '('
            else if (i === 2) out += ' '
            else if (i === 6 && d.length === 10) out += '-'
            else if (i === 7 && d.length > 10) out += '-'
            out += d[i]
            if (i === 1) out += ')'
          }
          input.value = out
        })
        btn.addEventListener('click', async () => {
          msg.textContent = ''
          const phone = input.value.trim()
          if (!phone) { msg.textContent = tt('store.phoneRequired'); return }
          btn.disabled = true
          btn.textContent = tt('store.entering')
          try {
            // Cria a conta pelo telefone (sem liberar categorias aqui; a
            // liberação acontece após o pagamento externo via API).
            const b = await api('/api/store/register', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ phone, categoryIds: [] }),
            })
            localStorage.setItem(TOKEN_KEY, b.token)
            msg.textContent = tt('store.accountReady')
            msg.classList.add('ok')
            renderUser()
          } catch (e) {
            msg.textContent = e.message
          } finally {
            btn.disabled = false
            btn.textContent = tt('store.enter')
          }
        })
      }

      function categoryCard(c) {
        // Link de checkout: o definido na categoria (admin) tem prioridade;
        // o preço/URL estático da STORE_CONFIG é o fallback.
        const cfg = STORE_CONFIG.categories[c.name] || STORE_CONFIG.categories[c.id]
        const price = cfg ? cfg.price : tt('store.consult')
        const url = (c.checkoutUrl && c.checkoutUrl.trim()) ? c.checkoutUrl : (cfg ? cfg.url : null)
        // Capa da categoria (rota pública da loja). O ♫ fica de fundo e o
        // <img> cobre o card; se a imagem falhar (sem foto/capa), onerror
        // remove o <img> e o ♫ volta a aparecer.
        return (
          '<div class="card">' +
            '<div class="thumb">&#9835;' +
              '<img class="thumb-img" src="/api/store/categories/' + encodeURIComponent(c.id) + '/photo?size=300" alt="' + tt('store.categoryCover') + ' ' + esc(c.name) + '" loading="lazy" onerror="this.remove()" />' +
            '</div>' +
            '<h3>' + esc(c.name) + '</h3>' +
            '<p class="desc">' + fmt(c.songCount || 0) + '</p>' +
            '<span class="price">' + esc(price) + '</span>' +
            (url
              ? '<a class="buy-btn" href="' + esc(url) + '" target="_blank" rel="noopener">' + tt('store.buy') + '</a>'
              : '<span class="desc">' + tt('store.noCheckout') + '</span>') +
          '</div>'
        )
      }

      function packCard(p) {
        return (
          '<div class="card">' +
            '<span class="pack-badge">Pack</span>' +
            '<div class="thumb">&#127873;</div>' +
            '<h3>' + esc(p.name) + '</h3>' +
            '<p class="desc">' + esc(p.desc || p.categories.join(', ')) + '</p>' +
            '<span class="price">' + esc(p.price) + '</span>' +
            '<a class="buy-btn" href="' + esc(p.url) + '" target="_blank" rel="noopener">' + tt('store.buyPack') + '</a>' +
          '</div>'
        )
      }

      async function load() {
        // Textos estáticos da página (idioma ativo).
        $('#storeH1').textContent = tt('store.subtitle')
        $('#storeSubtitle').textContent = tt('store.desc')
        $('#storeCatsTitle').textContent = tt('store.categories')
        $('#storePacksTitle').textContent = tt('store.packs')
        $('#storeBack').innerHTML = '← ' + tt('store.back')
        $('#storeFooter').textContent = 'Play Music · ' + tt('store.footer')
        renderUser()
        try {
          const cats = await api('/api/store/categories')
          const grid = $('#catGrid')
          grid.innerHTML = ''
          if (!cats.length) { grid.innerHTML = '<p class="empty">' + tt('store.noCategories') + '</p>' }
          for (const c of cats) grid.insertAdjacentHTML('beforeend', categoryCard(c))

          const packs = STORE_CONFIG.packs || []
          const packsGrid = $('#packsGrid')
          packsGrid.innerHTML = ''
          if (packs.length) {
            for (const p of packs) packsGrid.insertAdjacentHTML('beforeend', packCard(p))
          } else {
            $('#packsSection').style.display = 'none'
          }
        } catch (e) {
          $('#catGrid').innerHTML = '<p class="empty">' + tt('store.loadError') + ' ' + esc(e.message) + '</p>'
        }
      }

      window.addEventListener('load', load)
    </script>
  </body>
</html>
