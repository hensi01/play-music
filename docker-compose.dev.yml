# Ambiente de desenvolvimento local: Play Music + MinIO + Redis.
# Os serviços MinIO e Redis são provisionados aqui para testes; em produção
# eles já existem no servidor Coolify.
#
# Uso:
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml logs -f playmusic
#
# Depois do primeiro "up", envie suas músicas para o MinIO:
#   mc alias set local http://localhost:9000 $MINIO_ACCESS_KEY $MINIO_SECRET_KEY
#   mc mb local/play-music-music
#   mc cp -r /sua/pasta/musicas/* local/play-music-music/
#
# A UI estará em http://localhost:4533 (criação do admin no primeiro acesso).

services:
  minio:
    image: minio/minio:latest
    container_name: playmusic-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: playmusic-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
      MINIO_BUCKET: "${MINIO_BUCKET}"
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY) do
        echo 'aguardando MinIO...'; sleep 2;
      done;
      /usr/bin/mc mb --ignore-existing local/$$MINIO_BUCKET;
      /usr/bin/mc mb --ignore-existing local/playmusic-transcode;
      exit 0;
      "
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: playmusic-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  playmusic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: playmusic
    ports:
      - "4533:4533"
    environment:
      ND_LOGLEVEL: info
      ND_PORT: 4533
      ND_DEFAULTLANGUAGE: pt-BR
      ND_ADMINUSERNAME: "${ND_ADMINUSERNAME}"
      ND_ADMINPASSWORD: "${ND_ADMINPASSWORD}"
      # Biblioteca no MinIO (S3 origin do Bunny CDN)
      ND_MUSICFOLDER: "s3://${MINIO_BUCKET}?endpoint=minio:9000&accessKey=${MINIO_ACCESS_KEY}&secretKey=${MINIO_SECRET_KEY}&secure=false"
      # MinIO (usado pelo backend S3 e pelo cache de transcoding)
      ND_S3_ENDPOINT: minio:9000
      ND_S3_ACCESSKEY: "${MINIO_ACCESS_KEY}"
      ND_S3_SECRETKEY: "${MINIO_SECRET_KEY}"
      ND_S3_BUCKET: "${MINIO_BUCKET}"
      ND_S3_SECURE: "false"
      # Redis
      ND_REDIS_ENABLED: "true"
      ND_REDIS_URL: "redis://redis:6379/0"
      # Bunny CDN (Pull Zone -> MinIO). Desligado no dev local.
      ND_CDN_ENABLED: "false"
      ND_CDN_BASEURL: "${ND_CDN_BASEURL}"
      ND_CDN_TOKENAUTHKEY: "${ND_CDN_TOKENAUTHKEY}"
      ND_CDN_TOKENTTL: "${ND_CDN_TOKENTTL}"
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
    volumes:
      - playmusic-data:/data
    depends_on:
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  minio-data:
  redis-data:
  playmusic-data:
