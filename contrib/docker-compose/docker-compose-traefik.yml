version: "3.6"

volumes:
  traefik_data:
  playmusic_data:

services:

  traefik:
    container_name: "traefik"
    image: traefik:2.9
    restart: unless-stopped
    read_only: true
    command:
      - "--log.level=ERROR"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.tc.acme.tlschallenge=true"
      #- "--certificatesresolvers.tc.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
      - "--certificatesresolvers.tc.acme.email=foo@foo.com"
      - "--certificatesresolvers.tc.acme.storage=/letsencrypt/acme.json"
    ports:
      - "443:443"
    volumes:
      - "traefik_data:/letsencrypt"
      #- "/var/run/docker.sock:/var/run/docker.sock:ro"

  playmusic:
    container_name: "playmusic"
    image: deluan/playmusic:latest
    restart: unless-stopped
    read_only: true
    # user: 1000:1000
    ports:
      - "4533:4533"
    environment:
      ND_SCANINTERVAL: 6h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 168h
      ND_BASEURL: ""
    volumes:
      - "playmusic_data:/data"
      #- "/mnt/music:/music:ro"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.playmusic.rule=Host(`foo.com`)"
      - "traefik.http.routers.playmusic.entrypoints=websecure"
      - "traefik.http.routers.playmusic.tls=true"
      - "traefik.http.routers.playmusic.tls.certresolver=tc"
      - "traefik.http.services.playmusic.loadbalancer.server.port=4533"
