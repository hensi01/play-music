version: '3.6'

volumes:
  playmusic_data:

services:

  playmusic:
    container_name: "playmusic"
    image: deluan/playmusic:latest
    restart: unless-stopped
    read_only: true
    # user: 1000:1000
    ports:
      - "4533:4533"
    volumes:
      - "playmusic_data:/data"
      #- "/mnt/music:/music:ro"
